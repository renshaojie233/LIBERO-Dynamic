# @package _global_

# Fixed-3-latent short-dense-history variant:
# video samples 9 frames at [-4,-3,-2,-1,0,4,8,12,16], so Wan VAE keeps 3 latent frames
# while the condition window focuses on local motion around the current observation.
# action samples 32 steps at [-16,...,15]; the first 16 are clean history/context,
# and only the last 16 future actions are denoised/lossed.
defaults:
  - override /data: libero_2cam
  - override /model: fastwam_joint
  - _self_

batch_size: 16
num_workers: 8

model:
  mot_checkpoint_mixed_attn: false
  num_history_frames: 5
  action_clean_prefix_steps: 16

data:
  train:
    num_frames: 17
    history_frame_stride: 1
    num_history_frames: ${model.num_history_frames}
    future_action_horizon: 16
    action_clean_prefix_steps: ${model.action_clean_prefix_steps}

lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 10
max_steps: null
log_every: 10
save_every: 2000
eval_every: 200

gradient_accumulation_steps: 1
weight_decay: 1e-2
resume: null
